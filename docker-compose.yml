services:

  fanficdownloader:
    build: .
    container_name: fanficdownloader

    environment:
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - ASPNETCORE_URLS=http://+:8080
      - FLARESOLVERR__URL=http://flaresolverr:8191

    ports:
      - "8080:8080"
    volumes:
      - ./FanficDownloader.Web/appsettings.json:/app/appsettings.json

    depends_on:
      - flaresolverr
      - postgres

    restart: unless-stopped


  flaresolverr:
    image: flaresolverr/flaresolverr
    container_name: flaresolverr

    ports:
      - "8191:8191"

    restart: unless-stopped


  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_DB: fanficdownloader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REMOVED_PASSWORD

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
    postgres_data: